<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instagram Story Uploader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <header>
        <h1>Story Uploader</h1>
        <p>Use Instagram in a tab to upload stories.</p>
      </header>
      <section class="status">
        <div id="statusText">Waiting for Instagram tab.</div>
        <div id="queueCount">Queue: 0</div>
      </section>
      <section class="actions">
        <button id="openInstagram" type="button">Open Instagram</button>
        <button id="openModal" type="button">Open Upload UI</button>
      </section>
      <section class="toggles">
        <label>
          <input id="mobileMode" type="checkbox" />
          Mobile mode
        </label>
        <label>
          <input id="debugMode" type="checkbox" />
          Debug logs
        </label>
      </section>
      <footer>
        <a href="https://www.instagram.com/" target="_blank" rel="noreferrer">instagram.com</a>
      </footer>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
